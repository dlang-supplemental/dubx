name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openshellorg/prohelp
          ref: v0.2.1
          path: deps/prohelp
      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      - run: dub build --build=release
      - run: |
          ./dubx
          test $? -eq 2
          ./dubx "?"
      - run: ./dubx which || true
