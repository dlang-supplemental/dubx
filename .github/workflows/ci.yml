name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest
      - run: dub build --build=release
      - run: |
          rc=0; ./dubx || rc=$?
          test "$rc" -eq 2
          ./dubx "?"
      - run: ./dubx which || true
